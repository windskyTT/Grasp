seed: 1
environment:
  hardware:
    kinematic_type: "simfk"
    arm_type: "ur5"
    hand_type: "allegro"
    real_world_mode: false
    flying_hand_mode: false
    save_state_mode: false
    rsc_model: "ur5_allegro"
    sim_model: "ur5_allegro"
    init_finger_pose: [0.2, 0.6, 0.2, 0.5, 0.2, 0.6, 0.2, 0.5, 0.2, 0.6, 0.2, 0.5, 1.3, 0.0, -0.1, 0.2]
    table_friction: 0.2
    hand_center: [-0.0091, 0.0, -0.095]
  biased: false
  grasp_steps: 70
  simulation_dt: 0.01
  control_dt: 0.2
  sample_num: 10
  non_uniform_sampling: true
  top: false
  load_set: "new_training_set"
  finger_action_std: 0.015
  rot_action_std: 0.005
  camera_position: [0.035, -0.58, 1.531]
  length_score_coeff: 5.0
  angle_score_coeff: 1.0
  eval_during_training: false
  eval_every_n: 500
  update_every_n: 20
  num_threads: 16
  max_time: 4.0
  render: true
  visualize: false
  reward:
    affordance_reward: {coeff: 0.5}
    affordance_contact_reward: {coeff: 1.5}
    affordance_impulse_reward: {coeff: 1.0}
    table_reward: {coeff: -0.03}
    table_contact_reward: {coeff: -1.0}
    table_impulse_reward: {coeff: -0.5}
    arm_height_reward: {coeff: -0.05}
    arm_contact_reward: {coeff: -0.1}
    arm_impulse_reward: {coeff: -0.1}
    arm_collision_reward: {coeff: -1.0}
    push_reward: {coeff: -0.0}
    wrist_vel_reward_: {coeff: -1.0}
    wrist_qvel_reward_: {coeff: -0.1}
    obj_vel_reward_: {coeff: -15.0}
    obj_qvel_reward_: {coeff: -0.2}
    obj_displacement_reward: {coeff: -5.0}
    arm_joint_vel_reward_: {coeff: -1.0}
architecture:
  policy_net: [128, 128]
  value_net: [128, 128]
